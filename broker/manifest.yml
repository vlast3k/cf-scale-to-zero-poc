applications:
  - name: s2z-broker
    memory: 32M
    disk_quota: 64M
    instances: 1
    buildpack: binary_buildpack
    command: ./s2z-broker
    health-check-type: process
    env:
      CF_API: ((cf_api))
      CF_ADMIN_USER: ((cf_admin_user))
      CF_ADMIN_PASS: ((cf_admin_pass))
      BROKER_USER: admin
      BROKER_PASS: ((broker_pass))
      BROKER_ROUTE: ((broker_route))
